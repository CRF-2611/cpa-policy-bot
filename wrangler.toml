name                 = "cpa-policy-bot"
main                 = "worker/src/index.ts"
compatibility_date   = "2026-04-30"
compatibility_flags  = ["nodejs_compat"]

[assets]
directory = "./frontend"
binding   = "ASSETS"

[triggers]
crons = [
  "0 * * * *",   # Every hour — Notion Lines to Take (fast incremental once fully loaded)
  "30 6 * * *",  # 06:30 UTC daily — Google Drive briefings
  # Parliamentary sync runs via GitHub Actions (see .github/workflows/parliamentary-sync.yml)
  # — moved there because Parliament APIs block Cloudflare Worker IP ranges
]
